name: Build MedConnect pour le Microsoft Store (MSIX/AppX)
# Produit le paquet .appx à soumettre dans Partner Center. Microsoft signe
# lui-même le paquet à la publication : aucun certificat de signature de
# code n'est nécessaire ici, et Windows n'affiche plus d'avertissement
# pour les utilisateurs qui installent depuis le Store.
#
# Identité du paquet (Partner Center → Gestion des produits → Identité du
# produit) : définie dans electron/package.json, section build.appx.
# Voir docs/MICROSOFT_STORE.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (vide = version de package.json racine)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Paquet Microsoft Store
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer la version demandée à package.json racine (si fournie)
        if: github.event.inputs.version != ''
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ github.event.inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Installer les dépendances Electron
        working-directory: electron
        run: npm ci

      - name: Construire le paquet .appx
        working-directory: electron
        run: npm run dist:store

      - name: Vérifier le paquet produit
        shell: bash
        run: |
          shopt -s nullglob
          files=(electron/dist/*.appx)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Paquet .appx introuvable (ou plusieurs) dans electron/dist"
            ls -la electron/dist || true
            exit 1
          fi
          SIZE=$(stat -c%s "${files[0]}")
          if [ "$SIZE" -lt $((20*1024*1024)) ]; then
            echo "::error::Paquet anormalement petit ($SIZE octets) : ${files[0]}"
            exit 1
          fi
          echo "OK : ${files[0]} ($SIZE octets)"

      - name: Upload artefact Store
        uses: actions/upload-artifact@v4
        with:
          name: medconnect-msstore
          path: electron/dist/*.appx
          if-no-files-found: error

  release:
    name: Publier le .appx sur une GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Télécharger le paquet
        uses: actions/download-artifact@v4
        with:
          name: medconnect-msstore
          path: store

      # Lien de téléchargement direct (pratique depuis un téléphone) :
      # release vX.Y.Z-store, remplacée à chaque nouveau build de la même version.
      - name: Créer / mettre à jour la release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.version }}" ]; then VERSION="${{ github.event.inputs.version }}"; fi
          TAG="v${VERSION}-store"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" store/*.appx \
            --title "MedConnect ${VERSION} — Microsoft Store" \
            --notes "Paquet .appx à déposer dans Partner Center (rubrique Packages). Ne pas installer directement : il n'est signé qu'après publication par le Microsoft Store."
