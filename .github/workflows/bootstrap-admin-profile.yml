name: Bootstrap profil administrateur

# Déclenchement MANUEL uniquement (workflow_dispatch). Crée le document
# Firestore users/{uid} avec role:"admin" / status:"approved" pour
# l'adresse e-mail fournie, en résolvant l'UID côté serveur via Firebase
# Auth. Réutilise le secret FIREBASE_SERVICE_ACCOUNT_JSON déjà configuré
# (sauvegardes / sync sécurité) — aucune clé n'est jamais exposée ni
# stockée dans le dépôt. N'accorde aucun custom claim (celui-ci reste
# piloté par ADMIN_UID_ALLOWLIST dans sync-account-security).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail du compte administrateur à configurer"
        required: true
        type: string
      name:
        description: "Nom affiché (optionnel)"
        required: false
        default: "Administrateur"
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Créer le profil users/{uid} admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier le secret requis
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Secret manquant : FIREBASE_SERVICE_ACCOUNT_JSON (voir docs/BACKUP_RESTORE_RUNBOOK.md)" && exit 1)

      - name: Installer firebase-admin (non permanent)
        run: npm install firebase-admin --no-save

      - name: Écrire la clé de compte de service
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json

      - name: Créer le profil administrateur
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_NAME: ${{ inputs.name }}
        run: node scripts/bootstrap-admin-profile.mjs --apply

      - name: Supprimer la clé décodée
        if: always()
        run: rm -f /tmp/firebase-service-account.json
